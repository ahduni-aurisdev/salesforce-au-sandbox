<template>
    <lightning-card>
        <!-- Spinner Overlay -->
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Saving..." size="medium" variant="brand">
            </lightning-spinner>
        </template>

        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <span class="slds-icon_container slds-icon-standard-call">
                        <lightning-icon icon-name="standard:call" size="small"></lightning-icon>
                    </span>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span class="slds-text-heading_small">Call Confirmation</span>
                    </h2>
                </div>
            </header>
        </div>

        <div class="slds-card__body slds-card__body_inner">
            <div class="slds-text-body_regular slds-m-bottom_medium slds-text-color_weak">
                Please select the outcome of the call.
            </div>

            <!-- Custom Radio Button Design -->
            <div class="custom-radio-container">
                <div class="radio-option-wrapper" onclick={handleNotConnectedClick}>
                    <input type="radio" id="option-not-connected" name="callConfirmation" value="Not Connected"
                        checked={isNotConnectedSelected} class="custom-radio-input" />
                    <label for="option-not-connected" class="custom-radio-label error-option">
                        <div class="radio-icon-wrapper">
                            <lightning-icon icon-name="utility:close" size="small" class="option-icon"></lightning-icon>
                        </div>
                        <div class="radio-content">
                            <div class="radio-title">Not Connected</div>
                        </div>
                        <div class="radio-check">
                            <lightning-icon icon-name="utility:check" size="x-small"></lightning-icon>
                        </div>
                    </label>
                </div>

                <div class="radio-option-wrapper" onclick={handleConnectedFollowUpRequiredClick}>
                    <input type="radio" id="option-follow-up" name="callConfirmation"
                        value="Connected Follow-Up Required" checked={isConnectedFollowUpRequiredSelected}
                        class="custom-radio-input" />
                    <label for="option-follow-up" class="custom-radio-label warning-option">
                        <div class="radio-icon-wrapper">
                            <lightning-icon icon-name="utility:warning" size="small"
                                class="option-icon"></lightning-icon>
                        </div>
                        <div class="radio-content">
                            <div class="radio-title">Connected Follow-Up Required</div>
                        </div>
                        <div class="radio-check">
                            <lightning-icon icon-name="utility:check" size="x-small"></lightning-icon>
                        </div>
                    </label>
                </div>

                <div class="radio-option-wrapper" onclick={handleConnectedInterestedClick}>
                    <input type="radio" id="option-connected-interested" name="callConfirmation"
                        value="Connected Interested" checked={isConnectedInterestedSelected}
                        class="custom-radio-input" />
                    <label for="option-connected-interested" class="custom-radio-label success-option">
                        <div class="radio-icon-wrapper">
                            <lightning-icon icon-name="utility:like" size="small" class="option-icon"></lightning-icon>
                        </div>
                        <div class="radio-content">
                            <div class="radio-title">Connected Interested</div>
                        </div>
                        <div class="radio-check">
                            <lightning-icon icon-name="utility:check" size="x-small"></lightning-icon>
                        </div>
                    </label>
                </div>

                <div class="radio-option-wrapper" onclick={handleConnectedNotInterestedClick}>
                    <input type="radio" id="option-connected-not-interested" name="callConfirmation"
                        value="Connected Not Interested" checked={isConnectedNotInterestedSelected}
                        class="custom-radio-input" />
                    <label for="option-connected-not-interested" class="custom-radio-label error-option">
                        <div class="radio-icon-wrapper">
                            <lightning-icon icon-name="utility:dislike" size="small"
                                class="option-icon"></lightning-icon>
                        </div>
                        <div class="radio-content">
                            <div class="radio-title">Connected Not Interested</div>
                        </div>
                        <div class="radio-check">
                            <lightning-icon icon-name="utility:check" size="x-small"></lightning-icon>
                        </div>
                    </label>
                </div>

                <div class="radio-option-wrapper" onclick={handleConvertedClick}>
                    <input type="radio" id="option-converted" name="callConfirmation" value="Converted"
                        checked={isConvertedSelected} class="custom-radio-input" />
                    <label for="option-converted" class="custom-radio-label success-option">
                        <div class="radio-icon-wrapper">
                            <lightning-icon icon-name="utility:success" size="small"
                                class="option-icon"></lightning-icon>
                        </div>
                        <div class="radio-content">
                            <div class="radio-title">Converted</div>
                        </div>
                        <div class="radio-check">
                            <lightning-icon icon-name="utility:check" size="x-small"></lightning-icon>
                        </div>
                    </label>
                </div>

                <div class="radio-option-wrapper" onclick={handleClosedClick}>
                    <input type="radio" id="option-closed" name="callConfirmation" value="Closed"
                        checked={isClosedSelected} class="custom-radio-input" />
                    <label for="option-closed" class="custom-radio-label success-option">
                        <div class="radio-icon-wrapper">
                            <lightning-icon icon-name="utility:lock" size="small" class="option-icon"></lightning-icon>
                        </div>
                        <div class="radio-content">
                            <div class="radio-title">Closed</div>
                        </div>
                        <div class="radio-check">
                            <lightning-icon icon-name="utility:check" size="x-small"></lightning-icon>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Comment Field -->
            <div class="slds-m-top_large">
                <lightning-textarea label="Comments"
                    placeholder="Enter any additional notes or comments about the call..." value={commentValue}
                    onchange={handleCommentChange} max-length="32000" class="comment-field">
                </lightning-textarea>
            </div>
        </div>

        <footer class="slds-card__footer">
            <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center">
                <lightning-button label="Cancel" onclick={handleCancel} class="slds-m-right_x-small">
                </lightning-button>
                <lightning-button variant="brand" label="Save & Update Lead" icon-name="utility:check"
                    onclick={handleSave} disabled={isSaveDisabled}>
                </lightning-button>
            </div>
        </footer>
    </lightning-card>
</template>
